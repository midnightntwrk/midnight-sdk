# Wait 7 days before resolving newly published package versions, to reduce exposure to
# malicious or unstable releases (supply-chain age gate; requires Yarn >= 4.10).
npmMinimalAgeGate: "7d"

# No npmScopes entries: both @midnight-ntwrk and @midnightntwrk resolve from
# npmjs, which is Yarn's default registry, and both are public so no auth is
# needed. Publishing is done by CD with npm Trusted Publishing — see
# docs/npmjs-trusted-publishing.md.
