compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

npmMinimalAgeGate: '7d'

# No npmScopes entry for @midnight-ntwrk: those packages are published to (and
# resolved from) npmjs, which is Yarn's default registry, and they are public so
# no auth is needed. Publishing is done by CD with npm Trusted Publishing — see
# docs/npmjs-trusted-publishing.md.

yarnPath: .yarn/releases/yarn-4.10.3.cjs

changesetBaseRefs: ['origin/main']
