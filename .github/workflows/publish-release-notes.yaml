name: Publish release notes

# Release notes are generated from the repository at the tag, never hand-written: see
# compact-js/scripts/release-notes.mjs. CD calls this once a release exists; the dispatch trigger
# regenerates the note for any earlier tag, which is also how a note is corrected after the fact.

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish notes for, without the compact-js-v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish notes for, for example 3.0.0-rc.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-notes-${{ inputs.version }}

jobs:
  publish:
    name: Generate and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v5
        with:
          # The generator reads manifests at the tag and walks the commit range back to the
          # previous one, so it needs every tag and the history between them.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: node compact-js/scripts/release-notes.mjs --version "$VERSION" --out notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: compact-js-v${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::no release to publish to (expected tag $TAG)"
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          echo "::notice::published release notes to $TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v4
        if: always()
        with:
          name: release-notes-${{ inputs.version }}
          path: notes.md
          if-no-files-found: ignore
