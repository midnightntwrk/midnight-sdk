name: Build - Compact.js
env:
  MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

permissions:
  contents: read
  issues: read
  packages: read
  checks: write
  pull-requests: write

# Called only from cd.yaml. Publishing deliberately does NOT live here: the npmjs
# Trusted Publisher is bound to `cd.yaml`, and a called workflow would make the
# OIDC workflow ref ambiguous. See docs/npmjs-trusted-publishing.md.
on:
  workflow_call:
    inputs:
      should_run:
        required: true
        type: string

concurrency:
  group: compact-js-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: inputs.should_run == 'true'
    uses: ./.github/workflows/ci-base.yaml
    with:
      workspace: compact-js
      create-package-artifacts: true
    secrets: inherit
