name: Publish - Compact.js
env:
  MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

permissions:
  contents: write
  issues: read
  id-token: write
  packages: write
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      should_run:
        required: true
        type: string

concurrency:
  group: compact-js-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: inputs.should_run == 'true'
    uses: ./.github/workflows/ci-base.yaml
    with:
      workspace: compact-js
      create-package-artifacts: true
    secrets: inherit

  publish:
    needs: ci
    name: Publish Packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      base_version: ${{ steps.extract_version.outputs.base_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v4
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: '@midnight-ntwrk'
          node-version-file: .nvmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Publish Package Artifacts
        uses: ./.github/actions/publish-package-artifacts
        with:
          package-archive-name: 'compact-js'
          working-directory: ./compact-js
          auth-token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Extract version for release
        id: extract_version
        run: |
          version=$(jq -r '.version' ./compact-js/compact-js/package.json)
          base_version=$(echo "$version" | sed 's/-alpha.*//')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"

  release:
    needs: publish
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v5
        with:
          fetch-tags: true

      - name: Create git tag
        env:
          TAG: compact-js-v${{ needs.publish.outputs.base_version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: compact-js-v${{ needs.publish.outputs.base_version }}
          VERSION: ${{ needs.publish.outputs.base_version }}
        run: |
          # Other workspaces and hand-cut tags share this repo, so the notes range is pinned to the
          # previous compact-js tag instead of whichever tag GitHub would pick as the most recent.
          previous_tag=$(git tag -l 'compact-js-v*' --sort=-creatordate | grep -vFx "$TAG" | head -1)
          args=(--title "compact-js v$VERSION" --repo "$REPO" --generate-notes)
          if [ -n "$previous_tag" ]; then
            args+=(--notes-start-tag "$previous_tag")
          fi
          case "$VERSION" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${args[@]}"

  release-notes:
    needs: [publish, release]
    name: Publish release notes
    uses: ./.github/workflows/publish-release-notes.yaml
    with:
      version: ${{ needs.publish.outputs.base_version }}
